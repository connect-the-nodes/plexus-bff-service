name: Deploy - Zynchub Digital Hub Service

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stage
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      - name: Build application
        run: mvn clean package -DskipTests

      - name: Extract Maven Version
        id: prep
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | xargs)
          echo "POM_VERSION=$VERSION" >> $GITHUB_ENV
          echo "TF_VAR_app_version=$VERSION" >> $GITHUB_ENV

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: terraform/envs/${{ inputs.environment }}
        run: terraform init

      # Step 1: Run Terraform Apply first to ensure the S3 Bucket exists
      # We use -target if we want to be specific, but a full apply is fine.
      - name: Terraform Apply (Create Infrastructure)
        working-directory: terraform/envs/${{ inputs.environment }}
        run: terraform apply -auto-approve -input=false

      # Step 2: Now that the bucket exists, upload the JAR
      - name: Upload JAR to S3
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="zynchub-artifacts-${ACCOUNT_ID}-${{ inputs.environment }}"
          aws s3 cp target/zynchub-${{ env.POM_VERSION }}.jar s3://${BUCKET_NAME}/hub-service/app.jar

      # Step 3: Run Apply again (Lambda will now see the new S3 object and update)
      - name: Terraform Apply (Update Lambda Code)
        working-directory: terraform/envs/${{ inputs.environment }}
        run: terraform apply -auto-approve -input=false