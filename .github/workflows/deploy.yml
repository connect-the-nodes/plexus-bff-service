name: Deploy - Zynchub Digital Hub Service

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stage
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # These variables allow Terraform to map inputs to var.environment and var.aws_region automatically
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build application
        run: mvn clean package -DskipTests

      - name: Extract Maven Version
        id: prep
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | xargs)
          echo "POM_VERSION=$VERSION" >> $GITHUB_ENV
          echo "TF_VAR_app_version=$VERSION" >> $GITHUB_ENV

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: terraform/envs/${{ inputs.environment }}
        run: terraform init

      # STEP 1: Create the S3 Bucket first so it exists for the upload
      # Note: 'aws_s3_bucket.lambda_artifacts' should match your resource name in main.tf
      - name: Terraform Bootstrap (S3 Bucket)
        working-directory: terraform/envs/${{ inputs.environment }}
        run: terraform apply -target=aws_s3_bucket.lambda_artifacts -auto-approve -input=false

      # STEP 2: Upload the JAR to the bucket
      - name: Upload JAR to S3
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="zynchub-artifacts-${ACCOUNT_ID}-${{ inputs.environment }}"
          aws s3 cp target/zynchub-${{ env.POM_VERSION }}-aws.jar s3://${BUCKET_NAME}/hub-service/app.jar

      # STEP 3: Complete the deployment (Lambda + API Gateway)
      - name: Terraform Apply (Full)
        working-directory: terraform/envs/${{ inputs.environment }}
        run: terraform apply -auto-approve -input=false