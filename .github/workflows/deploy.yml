name: Deploy - Zynchub Digital Hub Service

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stage
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Job-level variables (Terraform automatically picks up TF_VAR_ prefix)
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      JAR_NAME: "zynchub-digital-hub-service.jar"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      - name: Build application
        run: mvn clean package -DskipTests

      - name: Extract Maven Version
        id: prep
        run: |
          # Extract version and remove whitespace
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | xargs)
          echo "POM_VERSION=$VERSION" >> $GITHUB_ENV
          echo "TF_VAR_app_version=$VERSION" >> $GITHUB_ENV

      - name: Copy JAR to Terraform folder
        run: |
          cp target/zynchub-${{ env.POM_VERSION }}.jar terraform/envs/${{ inputs.environment }}/${{ env.JAR_NAME }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: terraform/envs/${{ inputs.environment }}
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform/envs/${{ inputs.environment }}
        run: terraform plan -input=false

      - name: Terraform Apply
        working-directory: terraform/envs/${{ inputs.environment }}
        run: terraform apply -auto-approve -input=false