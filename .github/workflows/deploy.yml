name: Build and Push Hub Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, staging, prod]
      image_tag:
        description: "Optional image tag override (defaults to commit SHA)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve target environment and tag
        shell: bash
        run: |
          TARGET_ENV="dev"
          IMAGE_TAG="${{ github.sha }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_ENV="${{ inputs.environment }}"
            if [ -n "${{ inputs.image_tag }}" ]; then
              IMAGE_TAG="${{ inputs.image_tag }}"
            fi
          fi
          echo "TARGET_ENV=$TARGET_ENV" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "ECR_REPO_NAME=zynchub-repo-$TARGET_ENV" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify target AWS account
        run: |
          if [ -z "${{ secrets.AWS_ACCOUNT_ID }}" ]; then
            echo "Missing AWS_ACCOUNT_ID secret."
            exit 1
          fi
          ACTUAL_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if [ "$ACTUAL_ACCOUNT_ID" != "${{ secrets.AWS_ACCOUNT_ID }}" ]; then
            echo "Configured role is using AWS account $ACTUAL_ACCOUNT_ID, expected ${{ secrets.AWS_ACCOUNT_ID }}."
            exit 1
          fi

      - name: Ensure ECR repository exists
        run: |
          aws ecr create-repository --repository-name "$ECR_REPO_NAME" >/dev/null 2>&1 || true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG

          docker tag $ECR_REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPO_NAME:latest
          docker push $ECR_REGISTRY/$ECR_REPO_NAME:latest

      - name: Verify ECR Image Tag Exists
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPO_NAME" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "${{ secrets.AWS_REGION }}"
