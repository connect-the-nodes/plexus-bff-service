name: Deploy - Zynchub Digital Hub Service (ECS EC2)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # These variables tell Terraform which env and tag to use
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      ECR_REPO_NAME: zynchub-repo-${{ inputs.environment }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build using the Dockerfile we discussed
          docker build -t $ECR_REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG
          
          # Export variables for Terraform step
          echo "TF_VAR_app_version=$IMAGE_TAG" >> $GITHUB_ENV
          echo "TF_VAR_ecr_repository_url=$ECR_REGISTRY/$ECR_REPO_NAME" >> $GITHUB_ENV

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply
        working-directory: terraform/envs/${{ inputs.environment }}
        run: |
          terraform init
          terraform apply -auto-approve -input=false
