name: Build and publish Plexus Hub image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options: [dev, test, staging, prod]
      release_tag:
        description: Optional immutable SemVer tag, for example v1.2.3
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: plexus-hub-publish-${{ inputs.environment || 'dev' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

  publish:
    name: Publish immutable ECR image
    needs: test
    permissions:
      contents: read
      id-token: write # Required by the reusable AWS OIDC workflow.
      attestations: write # Required by the reusable provenance workflow.
    uses: connect-the-nodes/zynchub-reusable-workflows/.github/workflows/build-publish-container-aws-ecr.yml@cb94678cac2e6456d272f9d6b87bca727165ec2d # v1.0.3
    with:
      environment: ${{ inputs.environment || 'dev' }}
      aws_region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      ecr_repository: plexus-hub-${{ inputs.environment || 'dev' }}
      context: .
      dockerfile: dockerfile
      release_tag: ${{ inputs.release_tag || '' }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_DEPLOYMENT_ROLE || secrets.AWS_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
