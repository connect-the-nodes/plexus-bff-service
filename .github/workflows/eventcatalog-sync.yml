name: Notify EventCatalog

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger EventCatalog sync
        env:
          EVENTCATALOG_TOKEN: ${{ secrets.EVENTCATALOG_GH_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $EVENTCATALOG_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/connect-the-nodes/zynchub-event-catalog/dispatches \
            -d '{"event_type":"org-repo-push"}'

